name: Build Forst V24 Standalone
on:
  push:
    branches: [master]
    paths:
      - 'forst-privat-2026/spiel-luxus-v17.html'
      - 'forst-privat-2026/spiel-luxus-v24.html'
      - 'forst-privat-2026/build-v24-standalone.cjs'
      - '.github/workflows/build-forst-v24-standalone.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Create single HTML file
        run: node forst-privat-2026/build-v24-standalone.cjs
      - name: Commit generated standalone file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forst-privat-2026/spiel-luxus-v24-standalone.html
          if ! git diff --cached --quiet; then
            git commit -m "Build standalone Forst V24 HTML"
            git push
          fi
