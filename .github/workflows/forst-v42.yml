name: Forst V42 – Build und Qualitätsprüfung
on:
  push:
    branches: [master]
    paths:
      - 'forst-privat-2026/inspect-v41.cjs'
      - 'forst-privat-2026/build-v42.cjs'
      - '.github/workflows/forst-v42.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect existing game
        if: hashFiles('forst-privat-2026/inspect-v41.cjs') != ''
        run: node forst-privat-2026/inspect-v41.cjs
      - name: Build V42 and verify JavaScript syntax
        if: hashFiles('forst-privat-2026/build-v42.cjs') != ''
        run: node forst-privat-2026/build-v42.cjs
      - name: Commit generated report and V42
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f forst-privat-2026/v41-inspection.txt 2>/dev/null || true
          git add -f forst-v42/index.html 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Publish V42 improvements'
            git push
          fi
