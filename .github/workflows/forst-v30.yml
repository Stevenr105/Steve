name: Forst – Hauptversion V30
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'forst-privat-2026/build-v30.cjs'
      - 'forst-privat-2026/v30-rendered-skin.html'
      - '.github/workflows/forst-v30.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and assemble full V30
        run: node forst-privat-2026/build-v30.cjs
      - name: Publish current game
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forst-v30/index.html forst-final/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Forst V30 illustrated playable game'
            git push
          fi
