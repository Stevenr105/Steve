name: Forst – eine Hauptversion
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'forst-privat-2026/build-v32.py'
      - '.github/workflows/forst-v30.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove old interface layers and test complete V32
        run: python3 forst-privat-2026/build-v32.py
      - name: Publish one current Safari game
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forst-v32/index.html forst-final/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish simplified single-skin Forst V32'
            git push
          fi
