name: Forst – eine Hauptversion
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'forst-privat-2026/build-v44.cjs'
      - '.github/workflows/forst-v30.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and syntax-test V44 game
        run: node forst-privat-2026/build-v44.cjs
      - name: Publish current Safari game
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forst-v44/index.html forst-final/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish playable V44'
            git push
          fi
