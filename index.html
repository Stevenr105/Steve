<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><title>Der Forst der Finsternis – V54</title><style>html,body{margin:0;height:100%;background:#071c16;color:#f7e5b6;font:16px Georgia,serif}main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}h1{font-size:24px}progress{width:min(80vw,320px);height:18px;accent-color:#9bc494}small{color:#c2b48e}button{font:inherit;padding:12px 20px;border-radius:12px;border:1px solid #ba9650;background:#16372e;color:#fff2d8}</style></head><body><main><h1>Der Forst der Finsternis</h1><p id="msg">Das Abenteuer wird geladen…</p><progress id="progress" max="21" value="0"></progress><p><small>Einmaliges Laden der Grafiken. Bitte kurz warten.</small></p></main><script>(async()=>{const count=21;const m=document.getElementById('msg'),p=document.getElementById('progress');try{const chunks=await Promise.all(Array.from({length:count},(_,i)=>fetch('chunks/'+String(i).padStart(2,'0')+'.txt').then(r=>{if(!r.ok)throw Error('Datei '+i+' nicht erreichbar: '+r.status);p.value++;return r.text()})));m.textContent='Das Spiel wird vorbereitet…';const binary=atob(chunks.join(''));let bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);const decoded=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();bytes=null;document.open();document.write(decoded);document.close()}catch(e){console.error(e);m.textContent='Laden fehlgeschlagen: '+e.message;const b=document.createElement('button');b.textContent='Erneut versuchen';b.onclick=()=>location.reload();document.querySelector('main').appendChild(b)}})();</script></body></html>
