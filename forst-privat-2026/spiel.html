<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a110e"><meta name="robots" content="noindex,nofollow,noarchive">
<title>Der Forst der Finsternis</title>
<style>
:root{--gold:#ddb873;--paper:#efe0bc;--ink:#2a1b10;--green:#17352b;--green2:#0d1714;--shadow:0 20px 60px rgba(0,0,0,.55);}
*{box-sizing:border-box} html,body{margin:0;padding:0;background:#020303;color:#f3e7c4;font-family:Georgia,'Times New Roman',serif;-webkit-tap-highlight-color:transparent} button{font:inherit}
body{display:flex;justify-content:center}
#app{position:relative;width:min(100vw,430px);aspect-ratio:941/1672;max-height:100dvh;background:#000;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.7)}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hotspot{position:absolute;background:transparent;border:none;padding:0;margin:0;cursor:pointer}
.hotspot:active{outline:2px solid rgba(255,255,255,.2)}
#veil{position:fixed;inset:0;background:rgba(2,5,4,.72);backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:12px}
#veil.open{display:flex}
.sheet{width:min(100vw,430px);max-height:92dvh;overflow:auto;background:linear-gradient(180deg,#173327,#09110f);border:1px solid rgba(221,184,115,.45);border-radius:26px 26px 18px 18px;box-shadow:var(--shadow)}
.sheetHead{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:linear-gradient(180deg,#24493d,#11231d);border-bottom:1px solid rgba(221,184,115,.22)}
.sheetTitle{font-size:24px;font-weight:700;letter-spacing:.5px}
.closeBtn{appearance:none;border:1px solid rgba(221,184,115,.5);background:linear-gradient(180deg,#263833,#101715);color:#f6ebcf;border-radius:12px;padding:10px 14px}
.sheetBody{padding:14px}
.parchment{background:linear-gradient(180deg,#f0e3c1,#dbc48e);color:var(--ink);border:1px solid rgba(98,67,28,.4);border-radius:18px;padding:16px;box-shadow:0 12px 30px rgba(0,0,0,.34)}
.kicker{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#556347;font-weight:700;margin-bottom:6px}
.storyTitle{font-size:22px;font-weight:700;margin-bottom:10px}
.storyText{font-size:20px;line-height:1.43;white-space:pre-wrap}
.choiceList{display:grid;gap:10px;margin-top:14px}
.choiceBtn{appearance:none;border:1px solid rgba(221,184,115,.48);background:linear-gradient(180deg,#1d4c3d,#0d1714);color:#f7edd4;border-radius:16px;padding:14px 16px;text-align:left;box-shadow:0 12px 28px rgba(0,0,0,.35);font-weight:700}
.choiceBtn em{display:block;font-style:normal;font-weight:400;opacity:.84;font-size:12px;margin-top:4px}
.notice{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);color:#eadfbe;line-height:1.45}
.diceWrap{display:grid;gap:14px;place-items:center}
.diceRow{display:flex;gap:16px;justify-content:center;min-height:74px;perspective:900px}
.die{width:64px;height:64px;position:relative} .die.rolling{animation:tumble 1s ease-in-out} @keyframes tumble{0%{transform:rotateX(0) rotateY(0)}25%{transform:rotateX(200deg) rotateY(140deg)}50%{transform:rotateX(420deg) rotateY(260deg)}75%{transform:rotateX(610deg) rotateY(420deg)}100%{transform:rotateX(720deg) rotateY(540deg)}}
.face{position:absolute;inset:0;border-radius:14px;border:2px solid #f3c974;background:linear-gradient(180deg,#7b491b,#2b170b);display:grid;place-items:center;box-shadow:inset 0 0 18px rgba(0,0,0,.35),0 10px 20px rgba(0,0,0,.3)}
.pips{width:46px;height:46px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)} .pip{width:9px;height:9px;border-radius:50%;background:#fff5dc;justify-self:center;align-self:center}
.btnRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.bigBtn{appearance:none;border:1px solid rgba(221,184,115,.5);background:linear-gradient(180deg,#21483b,#0c1714);color:#f7edd4;border-radius:16px;padding:14px 16px;font-weight:700;box-shadow:0 12px 28px rgba(0,0,0,.35)}
.bigBtn.gold{background:linear-gradient(180deg,#75471a,#2a160a)} .bigBtn.dark{background:linear-gradient(180deg,#1d2321,#0d1211)}
.result{min-height:28px;text-align:center;color:#eadfbe;font-size:18px}
.input{width:100%;background:#f4ead2;color:#21160d;border:1px solid #a07f4e;border-radius:12px;padding:12px} .row{display:flex;gap:10px} .row>*{flex:1}
.logItem{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
</style>
</head>

const STORY_NONCE='uagg1XMLT2GG4RnF';
let BOOK_READY=false;
let BOOK_FAILED='';
function fromB64(str){return Uint8Array.from(atob(str), c=>c.charCodeAt(0));}
async function unlockBook(){
  const parsed=new URLSearchParams(location.hash.slice(1));
  const hex=parsed.get('k')||'';
  if(!/^[0-9a-f]{64}$/i.test(hex))throw new Error('Der private Spiel-Link ist unvollständig.');
  if(!crypto || !crypto.subtle)throw new Error('Bitte die HTTPS-Adresse direkt in Safari öffnen.');
  const raw=Uint8Array.from(hex.match(/../g),c=>parseInt(c,16));
  const k=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
  const decoded=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(STORY_NONCE),additionalData:new TextEncoder().encode('forst-private-v1')},k,fromB64(ENCRYPTED_STORY));
  BOOK=JSON.parse(new TextDecoder().decode(decoded));
  BOOK_READY=true;
  return Object.keys(BOOK).length;
}
function ensureReady(){
 if(BOOK_READY)return true;
 openSheet('Abenteuer',`<div class="notice">${BOOK_FAILED||'Dein Abenteuer wird gerade vorbereitet …'}</div>`);
 return false;
}
const KEY='forst-render-safari-v1';
let state=loadState();
function blankState(){return{current:238,visited:[238],notes:'',stats:{gew:10,sta:19,glk:8,gold:27},saveName:'Abschnitt 238'};}
function loadState(){try{return JSON.parse(localStorage.getItem(KEY))||blankState();}catch(e){return blankState();}}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function openSheet(title,html){document.getElementById('sheetTitle').textContent=title;document.getElementById('sheetBody').innerHTML=html;document.getElementById('veil').classList.add('open');}
function closeSheet(){document.getElementById('veil').classList.remove('open');}
function sectionText(t){return String(t||'').replace(/\s+Weiter bei\s+\d+\.?/ig,'').trim();}
function parseChoices(t){const out=[];const rx=/weiter bei\s+(\d+)/ig;let m;while((m=rx.exec(String(t||'')))!==null){const idx=m.index;const start=Math.max(0,idx-70);let frag=String(t).slice(start,idx).split(/[,.;:!?]/).pop().trim();frag=frag.replace(/^(und|oder|du kannst|wirst du|wenn du|falls du|an der du|an eine|an einem)\s+/i,'').trim();if(!frag) frag='Weiter';frag=frag.charAt(0).toUpperCase()+frag.slice(1);out.push({to:parseInt(m[1],10),label:frag});}
const seen=new Set();return out.filter(c=>{const k=c.label+'|'+c.to;if(seen.has(k))return false;seen.add(k);return true;});
}
function showSection(num){if(!ensureReady())return;const sec=BOOK[String(num)];state.current=num;if(!state.visited.includes(num))state.visited.push(num);saveState();if(!sec){openSheet('Abschnitt '+num,'<div class="notice">Dieser Abschnitt ist in der eingebauten Buchfassung nicht vorhanden.</div>');return;}const txt=sectionText(sec.t);const choices=parseChoices(sec.t);let html=`<div class="parchment"><div class="kicker">Abenteuer · ${num}</div><div class="storyTitle">Abschnitt ${num}</div><div class="storyText">${esc(txt)}</div></div>`;if(choices.length){html+='<div class="choiceList">'+choices.map(c=>`<button class="choiceBtn" onclick="showSection(${c.to})">${esc(c.label)}<em>Weiter bei Abschnitt ${c.to}</em></button>`).join('')+'</div>';} else {html+='<div class="choiceList"><button class="choiceBtn" onclick="closeSheet()">Zurück<em>dieser Abschnitt endet hier</em></button></div>';}openSheet('Abenteuer',html);}
function newGame(){if(!ensureReady())return;state=blankState();state.current=1;state.visited=[1];saveState();showSection(1);}
function continueGame(){if(!ensureReady())return;showSection(state.current||238);}
function openLog(){const visited=(state.visited||[]).slice().reverse();let list=visited.map(n=>`<div class="logItem"><button class="choiceBtn" style="width:100%" onclick="showSection(${n})">Abschnitt ${n}</button></div>`).join('');if(!list) list='<div class="notice">Noch kein Protokoll vorhanden.</div>';openSheet('Protokoll',`<div class="notice">Hier kannst du bereits besuchte Abschnitte direkt wieder aufrufen.</div><div style="height:10px"></div>${list}`);}
function pips(n){const map={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]}[n]||[];let h='';for(let i=1;i<=9;i++)h+=map.includes(i)?'<span class="pip"></span>':'<span></span>';return `<div class="pips">${h}</div>`;}
function renderDice(vals){return '<div class="diceRow">'+vals.map(v=>`<div class="die"><div class="face">${pips(v)}</div></div>`).join('')+'</div>';}
function openDice(){const html=`<div class="notice">Hier würfelst du digital für dein Abenteuer. Für Fighting Fantasy nutzt du meistens zwei W6.</div><div class="diceWrap"><div id="diceZone">${renderDice([1,1])}</div><div class="result" id="diceResult">Bereit zum Würfeln</div></div><div class="btnRow"><button class="bigBtn" onclick="rollDice(1)">1 Würfel</button><button class="bigBtn gold" onclick="rollDice(2)">2 Würfel</button></div>`;openSheet('Würfel',html);}
function rollDice(n){const zone=document.getElementById('diceZone');const result=document.getElementById('diceResult');if(!zone||!result)return;zone.innerHTML=renderDice(Array.from({length:n},()=>1));zone.querySelectorAll('.die').forEach(d=>d.classList.add('rolling'));result.textContent='Die Würfel rollen …';setTimeout(()=>{const vals=Array.from({length:n},()=>1+Math.floor(Math.random()*6));zone.innerHTML=renderDice(vals);result.textContent=`${n}W6: ${vals.join(' + ')} = ${vals.reduce((a,b)=>a+b,0)}`;} ,1000);}
saveState();
unlockBook().catch(e=>{BOOK_FAILED=e.message;console.error('Spiel konnte nicht geladen werden:',e.message)});
</script>
