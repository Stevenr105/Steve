<style id="forst-v30-design">
/* V30 - cohesive illustrated parchment and collectible-card design. */
#app{isolation:isolate!important;background:#06170c!important}
#bg{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;z-index:1!important}
#forestFx,#frontOrnaments,#v23-bag-ornament,#forst-foe-lunge{display:none!important}
#app>.backpackHotspot{right:0!important;bottom:0!important;width:17%!important;height:11%!important;z-index:160!important}
#app>.backpackHotspot::after{content:''!important}
#app>.towerTrophies{top:0!important;height:9%!important;left:0!important;width:18%!important;z-index:160!important}
#app>.skullValues{bottom:11%!important;top:auto!important;height:15%!important;z-index:160!important}
#app>.towerOptions{top:10%!important;left:0!important;width:15%!important;height:12%!important;z-index:160!important}
#app>.towerDice{top:23%!important;left:0!important;width:15%!important;height:9%!important;z-index:160!important}
#skin-ui-title{position:absolute;z-index:70;left:19%;right:11%;top:6%;font:700 clamp(18px,5.6vw,26px)/1.07 Georgia,'Times New Roman',serif;text-align:center;color:#29170b;filter:drop-shadow(0 1px 0 #f9e7bf);pointer-events:none}
#skin-ui-title strong{font-weight:700}
#skin-ui-title .rpg-orn{font-size:12px;display:block;color:#94703a;letter-spacing:3px;margin-top:2px}
#skin-statbar{position:absolute;z-index:75;left:19%;right:11%;top:12%;display:flex;gap:3px;justify-content:space-around;padding:3px 3px;background:linear-gradient(180deg,#291e15,#0a190e);border:2px ridge #b88d47;box-shadow:0 3px 6px #130b086e;border-radius:8px;pointer-events:none}
#skin-statbar span{display:flex;gap:3px;align-items:center;flex-direction:column;font:11px/1.15 Georgia,serif;color:#f6dea0;text-shadow:0 1px 2px #000}
#skin-statbar strong{font-size:15px;color:#fff1cc}
#dynamicScene{left:18.5%!important;top:17%!important;width:71.5%!important;height:16.5%!important;z-index:28!important;mask-image:linear-gradient(to bottom,transparent,black 12%,black 83%,transparent 100%)!important;-webkit-mask-image:linear-gradient(to bottom,transparent,black 12%,black 83%,transparent 100%)!important;pointer-events:none!important}
#dynamicScene .changingScene{filter:saturate(1.2) contrast(1.08)!important}
#skin-creature-lunge{position:absolute;z-index:90;display:none;pointer-events:none;top:0%;left:10%;height:38%;width:82%;background-image:var(--skin-boar);background-size:100% 100%;background-repeat:no-repeat;filter:drop-shadow(0 9px 10px #180e0ab0);-webkit-mask-image:linear-gradient(to bottom,black 0%,black 82%,transparent 100%);mask-image:linear-gradient(to bottom,black 0%,black 82%,transparent 100%);animation:creatureSway 3.5s ease-in-out infinite alternate}
@keyframes creatureSway{0%{transform:scale(1) translateY(-2px)}100%{transform:scale(1.015) translateY(3px)}}
#app.skin-boar-battle #skin-creature-lunge{display:block}
#app.skin-boar-battle #dynamicScene{display:none!important}
#app.skin-other-battle #dynamicScene{z-index:80!important;left:17%!important;top:5%!important;width:74%!important;height:36%!important;-webkit-mask-image:radial-gradient(ellipse 70% 85% at 50% 36%,black 43%,rgba(0,0,0,.97) 65%,transparent 100%)!important;mask-image:radial-gradient(ellipse 70% 85% at 50% 36%,black 43%,rgba(0,0,0,.97) 65%,transparent 100%)!important}
#app.skin-battle #skin-ui-title,#app.skin-battle #skin-statbar{display:none}
#veil{top:35%!important;left:18%!important;width:71.5%!important;height:51%!important;z-index:55!important;overflow:visible!important;border:0!important;box-shadow:none!important}
#veil .sheet{background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important}
#veil .sheetBody{height:100%!important;background:transparent!important;padding:4px 12px 17px!important;scrollbar-color:#b18c4b transparent!important;scrollbar-width:thin!important;overscroll-behavior:contain!important}
#veil .parchment{padding:3px 0!important;margin:0 0 9px!important;border:0!important;background:transparent!important;box-shadow:none!important}
#veil .kicker{font-size:10px!important;color:#88662d!important;text-transform:uppercase;letter-spacing:1px!important}
#veil .parchment h2,#veil .battleTitle{font:700 clamp(22px,6.2vw,33px)/1.12 Georgia,serif!important;text-align:center!important;color:#231509!important;margin:5px 0 14px!important}
#veil .parchment h2::after,#veil .battleTitle::after{content:'✦ ━━━ ◆ ━━━ ✦';display:block;font-size:12px;letter-spacing:1px;color:#ae8247;margin-top:8px}
#veil .storyText{font:clamp(15px,4.1vw,19px)/1.49 Georgia,'Times New Roman',serif!important;white-space:pre-wrap!important;color:#291a10!important;overflow-wrap:break-word!important;text-shadow:0 1px #fff7dd59}
#veil .parchment p{font:clamp(15px,4vw,18px)/1.45 Georgia,serif!important;color:#342316!important}
#veil .bronzeTitle{font:700 18px/1.3 Georgia,serif!important;color:#2b1d11!important;margin:17px 0 12px!important}
#veil .choices{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px!important;margin:13px 0 22px!important;align-items:stretch}
#veil .storyChoice{position:relative!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:flex-end!important;min-height:142px!important;padding:7px 8px!important;border-radius:9px!important;border:3px ridge #af8c47!important;background:linear-gradient(160deg,#335a43,#081c15)!important;box-shadow:inset 0 0 0 2px #181e1399,0 5px 8px #1d120d73!important;overflow:hidden!important;color:#fff0bf!important;text-align:center!important;gap:3px!important;transition:transform .13s ease,filter .13s ease!important}
#veil .storyChoice::before{content:'❦';position:absolute;top:0;left:6px;z-index:2;color:#f0d082;font-size:16px;text-shadow:0 1px 4px #000}
#veil .storyChoice img.choiceArt{position:absolute!important;top:0;left:0;width:100%!important;height:75%!important;max-width:none!important;aspect-ratio:auto!important;border:0!important;border-radius:0!important;object-fit:cover!important;filter:saturate(1.12) contrast(1.04)!important;opacity:.98!important}
#veil .storyChoice::after{content:'';position:absolute;inset:44% 0 0;background:linear-gradient(transparent,#132a22ef 45%,#07150fee);pointer-events:none}
#veil .storyChoice>span:not(.choiceArrow){z-index:3!important;position:relative!important;flex:none!important;line-height:1.12!important;font-size:clamp(13px,3.55vw,16px)!important;font-family:Georgia,serif!important;text-shadow:0 2px 3px #000!important;overflow-wrap:anywhere}
#veil .storyChoice small{color:#f1cd8a!important;opacity:1!important;font-size:10px!important;line-height:1.16!important}
#veil .choiceArrow{z-index:3;position:absolute;top:4px;right:6px;font-size:19px;color:#efca7d;text-shadow:0 1px 3px #000}
#veil .storyChoice:active{transform:scale(.97)!important;filter:brightness(1.15)}
#veil button.engraved:not(.storyChoice),#veil .minibtn,#veil .trophyPills button,#veil .trophyRoom button:not(.cardShelfSlot){border:2px ridge #bc9a53!important;border-radius:7px!important;background:linear-gradient(180deg,#2f573f,#0b2118)!important;box-shadow:inset 0 1px 3px #d5bf7473,0 3px 6px #39271963!important;color:#f8e4ba!important;font-family:Georgia,serif!important;line-height:1.18!important;min-height:39px!important}
#veil button.engraved:focus-visible,#veil .storyChoice:focus-visible{outline:3px solid #d5b661!important;outline-offset:2px!important}
#veil button.engraved:active,#veil .minibtn:active{transform:translateY(2px)!important}
#veil button.engraved[disabled]{opacity:.5!important}
#veil .notice{background:#273b2fe9!important;color:#f3deb9!important;border:1px solid #ad8b52!important;padding:10px!important;margin:10px 0!important;border-radius:7px!important;font-size:12px!important;line-height:1.4!important}
#veil .notice button{margin:5px!important}
#veil .sheetActions{gap:6px!important;padding:9px 0!important}
#veil .storyChoice .choiceArt{pointer-events:none}
#app.skin-battle #veil{top:37%!important;height:49%!important}
#app.skin-battle #veil .sheetBody{padding-top:3px!important}
#veil.v23Battle .sheetBody{padding-top:3px!important}
#veil .combatScene{display:none!important}
#veil .battleTitle{margin:0 0 8px!important}
#veil .fightSubtitle{font:13px Georgia,serif!important;color:#714e2e!important;text-align:center!important}
#veil .hpPair{margin:7px 0!important}
#veil .hpBox{background:linear-gradient(150deg,#2c4635,#10291e)!important;color:#f7e9be!important;border:2px ridge #af9558!important}
#veil .hpBox.enemy{background:linear-gradient(150deg,#573024,#20130f)!important}
#veil .battleReport{background:#edd3a3!important;color:#3b2415!important;border:1px solid #b58c56!important;border-radius:5px!important}
#veil .creatureCard{background:linear-gradient(160deg,#fff0c7,#deb97e)!important;border:4px ridge #9b703b!important;border-radius:9px!important;box-shadow:0 7px 16px #1d150c9c!important;overflow:hidden!important;color:#281a10!important}
#veil .creatureCard header,#veil .creatureCard footer{background:linear-gradient(100deg,#153728,#091910)!important;color:#f8dfaa!important;border-bottom:1px solid #a88749!important}
#veil .creaturePortrait{position:relative;min-height:190px!important;overflow:hidden!important;border-bottom:4px ridge #ad8d4e!important;background:#0c2016!important}
#veil .creaturePortrait img{display:block!important;width:100%!important;height:100%!important;min-height:190px!important;object-fit:cover!important;object-position:center 38%!important}
#veil .creaturePortrait .cardName{position:absolute!important;bottom:0;left:0;right:0;text-align:center;background:linear-gradient(transparent,#051b15ef)!important;color:#ffe3a6!important;font:700 22px Georgia,serif!important;padding:14px 3px 6px!important}
#veil .creatureStats{display:grid!important;grid-template-columns:repeat(2,1fr)!important;gap:6px!important;padding:8px!important;background:transparent!important}
#veil .creatureStats>div{padding:6px!important;border-radius:5px!important;background:linear-gradient(160deg,#244938,#0c1b14)!important;color:#f6e4b8!important;border:1px solid #927746!important}
#veil .creatureStats span{font:10px Georgia,serif!important}
#veil .creatureStats strong{font:700 18px Georgia,serif!important}
#veil .cardShelf{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}
#veil .cardZoom .cardZoomFront{max-width:100%!important}
#veil .trophyPills{display:flex!important;flex-wrap:wrap!important;gap:5px!important}
#veil .trophyPills button{font-size:11px!important;flex:1 0 auto!important}
#veil .storyLeafNavigation{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:5px!important;margin:12px 0!important;padding:5px 0!important;position:relative!important;z-index:25!important}
#veil .storyLeafNavigation button{min-height:34px!important;border:2px ridge #b18c50!important;border-radius:6px!important;background:linear-gradient(#2b573f,#10291c)!important;color:#f8eac5!important;font:12px Georgia,serif!important;padding:6px 7px!important}
#veil .storyLeafNavigation .leafNext{margin-left:auto!important}
#veil .bookCover{background:transparent!important;border:0!important;box-shadow:none!important;padding:18px 0!important;color:#301e13!important}
#veil .trophyRoom{background:transparent!important;border:0!important;box-shadow:none!important}
#veil .trophyTitle{color:#3d2413!important;text-shadow:none!important;font-size:22px!important;line-height:1.17!important}
#veil .trophyIntro{color:#412b16!important;font-size:13px!important;line-height:1.48!important;text-shadow:none!important}
#veil .forst-stat-roll{background:#ead1a2!important;color:#281a10!important}
#veil .forst-stat-roll button{width:auto!important;white-space:nowrap!important}
#skin-satchel{position:absolute;z-index:110;right:-2%;bottom:-8%;width:20%;height:22%;pointer-events:none;object-fit:cover;object-position:center;filter:drop-shadow(-5px 6px 5px #16110fbb);opacity:.99}
#app.skin-battle #skin-satchel{bottom:-8%;width:20%}
@media(max-width:350px){#veil .storyText{font-size:14px!important;line-height:1.43!important}#veil .storyChoice{min-height:118px!important}#skin-statbar span{font-size:9px!important}}
@media(prefers-reduced-motion:reduce){#skin-creature-lunge{animation:none!important}}

(function(){
'use strict';
const byId=id=>document.getElementById(id);
const app=byId('app');if(!app)return;
byId('bg').src=SKIN_ASSETS.frame;
const wrap=document.createElement('div');wrap.id='skin-ui-title';wrap.innerHTML='<strong>Der Forst der Finsternis</strong><span class="rpg-orn">❦ ✦ ❦</span>';
const stats=document.createElement('div');stats.id='skin-statbar';
const boar=document.createElement('div');boar.id='skin-creature-lunge';
boar.style.setProperty('--skin-boar','url("'+SKIN_ASSETS.boar+'")');
const bag=document.createElement('img');bag.id='skin-satchel';bag.src=SKIN_ASSETS.bag;bag.alt='';
app.append(wrap,stats,boar,bag);
let lastMode='';
function renderSkin(){
 const mode=typeof visiblePanel==='string'?visiblePanel:'home';
 const fight=mode==='combat'&&state.combat;
 const foe=String(fight?.name||'').toLocaleLowerCase('de');
 const isBoar=!!fight&&/wildschwein|keiler|\beber\b/.test(foe);
 app.classList.toggle('skin-battle',!!fight);
 app.classList.toggle('skin-boar-battle',isBoar);
 app.classList.toggle('skin-other-battle',!!fight&&!isBoar);
 if(fight&&!isBoar){
  const sc=byId('dynamicScene');
  const name=String(fight.name||'').toLowerCase();
  const art=/wolf/.test(name)?'forest_path':/waldschrat|baum/.test(name)?'waldschrat_duo':/spinne|troll|dämon/.test(name)?'slime_pit':'ork_battle';
  if(sc.dataset.scene!==art)showMainScene(art,Number(state.current)||7);
 }
 const hp=state.stats||{g:0,s:0,l:0};
 stats.innerHTML='<span>⚔ Gewandtheit<strong>'+Number(hp.g||0)+'</strong></span><span>♥ Stärke<strong>'+Number(hp.s||0)+'</strong></span><span>☘ Glück<strong>'+Number(hp.l||0)+'</strong></span>';
 if(mode!==lastMode){lastMode=mode;byId('sheetBody')?.scrollTo(0,0)}
}
const prevRender=renderPanel;
renderPanel=function(){const v=prevRender.apply(this,arguments);renderSkin();return v};
// Make 'Inventar' and portrait-style choices actual functional controls, not rasterized UI.
const oldCard=creatureCardHTML;
creatureCardHTML=function(card,expanded=false){
 const n=String(card?.name||'Gegner');
 const boarCard=/wildschwein|keiler|\beber\b/i.test(n);
 const photo=boarCard?SKIN_ASSETS.bestiary:cardArt(card);
 const esc=escapeHTML;
 return '<div class="creatureCard skin-card'+(expanded?' expanded':'')+'"><header><span>❧ BESTIARIUM ❧</span><small>'+esc(card.kind||'Gegner')+'</small></header><div class="creaturePortrait"><img src="'+photo+'" alt="'+esc(n)+'"><span class="cardName">'+esc(n)+'</span></div><div class="creatureStats"><div><span>⚔ Gewandtheit</span><strong>'+Number(card.g||0)+'</strong></div><div><span>♥ Stärke</span><strong>'+Number(card.hp||0)+'</strong></div><div><span>➶ Geschwindigkeit</span><strong>'+Number(card.speed||0)+'</strong></div><div><span>☠ Schrecken</span><strong>'+Number(card.fear||0)+'</strong></div></div><footer><span>DER FORST DER FINSTERNIS</span><span>✦</span></footer></div>';
};
const makeCards=()=>{
 const area=byId('sheetBody');if(!area)return;
 // Decorate choice art with coherent, ornate miniature paintings; keep onclick handlers intact.
 for(const [i,card] of Array.from(area.querySelectorAll('.storyChoice')).entries()){
  const art=card.querySelector('img.choiceArt');
  if(!art)continue;
  const label=card.textContent.toLowerCase();
  if(/inventar|rucksack|beutel/.test(label))art.src=SKIN_ASSETS.cards.inventory;
  else if(/kampf|angreif|schwert|schlag/.test(label))art.src=SKIN_ASSETS.cards.attack;
  else if(/flieh|ausweich|renn|lauf/.test(label))art.src=SKIN_ASSETS.cards.dodge;
  else if(i%3===0)art.src=SKIN_ASSETS.cards.attack;
  else if(i%3===1)art.src=SKIN_ASSETS.cards.dodge;
  else art.src=SKIN_ASSETS.cards.inventory;
 }
};
const lastRender=renderPanel;
renderPanel=function(){const r=lastRender.apply(this,arguments);makeCards();return r};
renderSkin();makeCards();
})();
</script>
